spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/upload_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:upload_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=8080

# upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
app.jwt.secret=${JWT_SECRET:CoxinhaPrintS3SuperSecreta1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AWS S3
aws.s3.bucket-name=${S3_BUCKET_NAME:prints-jogos}
aws.s3.region=${S3_REGION:sa-east-1}

